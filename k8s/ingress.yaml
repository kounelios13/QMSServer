apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qms-ingress
  namespace: qms
  annotations:
    # Use nginx ingress controller
    kubernetes.io/ingress.class: nginx
    # Enable cert-manager to automatically provision and manage TLS certificates
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Enable WebSocket support for SignalR
    nginx.ingress.kubernetes.io/websocket-services: qms-service
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Additional settings for better performance
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - qms.mkcodergr.eu
    secretName: qms-tls-cert
  rules:
  - host: qms.mkcodergr.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qms-service
            port:
              number: 80
