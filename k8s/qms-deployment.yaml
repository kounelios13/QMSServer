apiVersion: apps/v1
kind: Deployment
metadata:
  name: qms-app
  namespace: qms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qms-app
  template:
    metadata:
      labels:
        app: qms-app
    spec:
      containers:
      - name: qms-app
        image: qms-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: qms-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: qms-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: qms-secret
              key: ConnectionStrings__DefaultConnection
        - name: Logging__LogLevel__Default
          valueFrom:
            configMapKeyRef:
              name: qms-config
              key: Logging__LogLevel__Default
        - name: Logging__LogLevel__Microsoft.AspNetCore
          valueFrom:
            configMapKeyRef:
              name: qms-config
              key: Logging__LogLevel__Microsoft.AspNetCore
        - name: AllowedHosts
          valueFrom:
            configMapKeyRef:
              name: qms-config
              key: AllowedHosts
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
