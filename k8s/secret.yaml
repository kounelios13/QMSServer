apiVersion: v1
kind: Secret
metadata:
  name: qms-secret
  namespace: qms
type: Opaque
stringData:
  # ⚠️ WARNING: These are placeholder passwords for demonstration purposes only!
  # Before deploying to production, you MUST replace these with strong, unique passwords.
  # Use a password manager to generate secure passwords (minimum 32 characters).
  # Consider using Kubernetes secrets management tools like Sealed Secrets or External Secrets Operator.
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_STRONG_ROOT_PASSWORD_HERE"
  MYSQL_DATABASE: "appdb"
  MYSQL_USER: "appuser"
  MYSQL_PASSWORD: "CHANGE_ME_STRONG_APP_PASSWORD_HERE"
  # Make sure to update the password in the connection string below to match MYSQL_PASSWORD
  ConnectionStrings__DefaultConnection: "Server=mysql-service;Port=3306;Database=appdb;User=appuser;Password=CHANGE_ME_STRONG_APP_PASSWORD_HERE;"
